name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ github.sha }}
          restore-keys: |
            turbo-lint-
            turbo-

      - name: Lint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-
            turbo-

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: |
            turbo-test-
            turbo-

      - name: Write .env for prisma + tests
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://ecommerce:ecommerce@localhost:5432/ecommerce
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=test-jwt-secret-do-not-use-in-prod-32chars-min
          JWT_REFRESH_SECRET=test-jwt-refresh-secret-do-not-use-in-prod-32chars
          STRIPE_SECRET_KEY=
          RESEND_API_KEY=
          MAILCHIMP_API_KEY=
          KLAVIYO_API_KEY=
          S3_ACCESS_KEY=
          S3_SECRET_KEY=
          S3_BUCKET=
          NEWSLETTER_PROVIDER=stub
          SEARCH_PROVIDER=postgres-fts
          SEARCH_FTS_LANGUAGE=simple
          EOF

      - name: Prisma generate + migrate + seed
        run: |
          pnpm --filter @repo/api prisma:generate
          pnpm --filter @repo/api prisma:deploy
          pnpm --filter @repo/api db:seed

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: '1'
      API_URL: http://localhost:3001
      PUBLIC_WEB_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ github.sha }}
          restore-keys: |
            turbo-e2e-
            turbo-

      - name: Write .env for prisma + apps
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://ecommerce:ecommerce@localhost:5432/ecommerce
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=test-jwt-secret-do-not-use-in-prod-32chars-min
          JWT_REFRESH_SECRET=test-jwt-refresh-secret-do-not-use-in-prod-32chars
          API_URL=http://localhost:3001
          PUBLIC_WEB_URL=http://localhost:3000
          STRIPE_SECRET_KEY=
          RESEND_API_KEY=
          MAILCHIMP_API_KEY=
          KLAVIYO_API_KEY=
          S3_ACCESS_KEY=
          S3_SECRET_KEY=
          S3_BUCKET=
          NEWSLETTER_PROVIDER=stub
          SEARCH_PROVIDER=postgres-fts
          SEARCH_FTS_LANGUAGE=simple
          EOF

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Prisma generate + migrate + seed
        run: |
          pnpm --filter @repo/api prisma:generate
          pnpm --filter @repo/api prisma:deploy
          pnpm --filter @repo/api db:seed

      - name: Build
        run: pnpm build

      - name: Start API in background
        run: |
          pnpm --filter @repo/api start:prod > api.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "api ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "api never became healthy — dumping log:"
          cat api.log
          exit 1

      - name: Run Playwright
        run: pnpm --filter @repo/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload api.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ github.sha }}
          restore-keys: |
            turbo-build-
            turbo-

      - name: Build all packages
        run: pnpm build
